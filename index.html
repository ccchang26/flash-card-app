<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1E293B">
<title>Language Flashcard</title>

<!-- PWA 設定與 iOS 支援 -->
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="單字卡">
<link rel="apple-touch-icon" href="./icon.png">

<style>
  :root {
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --text-main: #0F172A;
    --text-muted: #64748B;
    --primary: #2563EB;
    --primary-hover: #1D4ED8;
    --border: #E2E8F0;
    --danger: #EF4444;
    --star: #EAB308;
    --star-bg: #FEF9C3;
    --card-bg: #FFFFFF;
    --mask-bg: #EEF2F6;
    --radius: 16px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden; /* 防止整個視窗隨意上下晃動 */
  }

  body {
    background-color: var(--bg);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
  }

  #app {
    width: 100%;
    max-width: 480px;
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    padding: env(safe-area-inset-top, 12px) 16px env(safe-area-inset-bottom, 12px);
  }

  /* ---------- 頂部導覽 (固定高度不被擠壓) ---------- */
  .topbar {
    height: 52px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    z-index: 10;
  }
  .deck-selector-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text-main);
    cursor: pointer;
    max-width: 260px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .deck-title-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .icon-btn {
    width: 44px;
    height: 44px;
    border: none;
    background: transparent;
    border-radius: 12px;
    color: var(--text-main);
    font-size: 1.3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn:active { background-color: var(--border); }

  /* ---------- 主舞台卡片 (彈性自適應，不溢出) ---------- */
  .stage {
    flex: 1;
    min-height: 0; /* 關鍵：讓 flex 內部能正確滾動而不被撐爆 */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 0 12px;
  }
  .card {
    width: 100%;
    height: 100%;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.06);
    display: flex;
    flex-direction: column;
    padding: 16px 18px 18px;
    touch-action: pan-y;
    user-select: none;
    position: relative;
    overflow: hidden;
  }
  .card-meta {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-muted);
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .card-meta-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* 星號按鈕 */
  .star-btn {
    border: none;
    background: transparent;
    font-size: 1.4rem;
    color: #CBD5E1;
    cursor: pointer;
    line-height: 1;
    padding: 2px 4px;
  }
  .star-btn.starred {
    color: var(--star);
  }

  /* 快速編輯按鈕 */
  .card-quick-edit-btn {
    border: none;
    background: #EFF6FF;
    color: var(--primary);
    padding: 5px 12px;
    border-radius: 12px;
    font-size: 0.78rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .card-quick-edit-btn:active { background: #DBEAFE; }

  /* 單字與翻譯區：防止內容過長互相重疊 */
  .word-zone {
    flex: 1.1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 12px 4px;
    overflow-y: auto;
  }
  .word-text {
    font-size: clamp(1.8rem, 6.5vw, 2.6rem);
    font-weight: 700;
    color: var(--text-main);
    word-break: break-word;
    line-height: 1.25;
  }
  .trans-zone {
    flex: 1;
    min-height: 100px;
    background-color: var(--mask-bg);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    cursor: pointer;
    overflow-y: auto;
  }
  .trans-content.blurred .trans-text,
  .trans-content.blurred .trans-note {
    filter: blur(8px);
    opacity: 0.25;
    user-select: none;
  }
  .trans-text {
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--text-main);
    word-break: break-word;
  }
  .trans-note {
    margin-top: 6px;
    font-size: 0.82rem;
    color: var(--text-muted);
    word-break: break-word;
  }
  .trans-hint {
    position: absolute;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--primary);
    background: rgba(255, 255, 255, 0.9);
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.95rem;
    line-height: 1.6;
    padding: 20px;
  }

  /* ---------- 底部導覽 (固定高度不貼底) ---------- */
  .bottom-nav {
    height: 56px;
    flex-shrink: 0;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .nav-btn {
    flex: 1;
    height: 52px;
    border: none;
    background-color: var(--text-main);
    color: #FFFFFF;
    font-size: 0.95rem;
    font-weight: 600;
    border-radius: 14px;
    cursor: pointer;
  }
  .nav-btn:active { opacity: 0.85; }
  .nav-btn[disabled] { opacity: 0.3; cursor: not-allowed; }

  .center-add-btn {
    width: 54px;
    height: 52px;
    flex-shrink: 0;
    border: none;
    background-color: var(--primary);
    color: #FFFFFF;
    font-size: 1.6rem;
    font-weight: 400;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
  }
  .center-add-btn:active {
    background-color: var(--primary-hover);
    transform: scale(0.96);
  }

  /* ---------- 彈出面板 (修正重疊與鍵盤避讓) ---------- */
  .sheet-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 999; /* 提高層級，防止與卡片按鈕重疊 */
  }
  .sheet-overlay.active { display: flex; }
  .sheet {
    width: 100%;
    max-width: 480px;
    max-height: 86dvh;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    display: flex;
    flex-direction: column;
    padding: 10px 18px calc(14px + env(safe-area-inset-bottom, 12px));
    box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
  }
  .sheet-handle {
    width: 36px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 10px;
    flex-shrink: 0;
  }
  .sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  .sheet-title {
    font-size: 1.05rem;
    font-weight: 700;
  }
  .sheet-header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .sheet-body {
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 12px;
    -webkit-overflow-scrolling: touch;
  }

  /* 表單元件 */
  label {
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-muted);
  }
  input[type="text"],
  input[type="search"] {
    width: 100%;
    height: 44px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.95rem;
    color: var(--text-main);
    background-color: var(--bg);
  }
  input[type="text"]:focus,
  input[type="search"]:focus {
    outline: none;
    border-color: var(--primary);
  }
  .status-text {
    font-size: 0.78rem;
    color: var(--primary);
    min-height: 1.1rem;
  }

  .btn {
    height: 44px;
    padding: 0 16px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .btn-primary { background-color: var(--primary); color: #FFFFFF; }
  .btn-primary:active { background-color: var(--primary-hover); }
  .btn-secondary {
    background-color: transparent;
    border-color: var(--border);
    color: var(--text-main);
  }
  .btn-secondary:active { background-color: var(--border); }
  .btn-text {
    border: none;
    background: transparent;
    color: var(--primary);
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
  }
  .sheet-actions {
    display: flex;
    gap: 10px;
    margin-top: 4px;
    flex-shrink: 0;
  }
  .sheet-actions .btn { flex: 1; }

  /* 排序標籤列 (支援橫向滑動) */
  .sort-bar {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
  }
  .sort-bar::-webkit-scrollbar { display: none; }
  .chip {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 0.78rem;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
  }
  .chip.active {
    border-color: var(--primary);
    background: #EFF6FF;
    color: var(--primary);
  }
  .chip.chip-star.active {
    border-color: var(--star);
    background: var(--star-bg);
    color: #A16207;
  }

  /* 單字列表項目 */
  .word-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .word-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .word-item-main {
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
  }
  .word-item-star {
    border: none;
    background: transparent;
    font-size: 1.2rem;
    color: #CBD5E1;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
    flex-shrink: 0;
  }
  .word-item-star.starred { color: var(--star); }
  .word-item-info { flex: 1; min-width: 0; }
  .word-item-word {
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--text-main);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .word-item-trans {
    font-size: 0.8rem;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 2px;
  }
  .word-item-ops {
    display: none;
    gap: 6px;
    flex-shrink: 0;
  }
  .management-mode .word-item-ops { display: flex; }
  .btn-sm {
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 600;
    border: 1px solid var(--border);
    background: #FFFFFF;
    color: var(--text-main);
    cursor: pointer;
  }
  .btn-sm.del {
    color: var(--danger);
    border-color: rgba(239, 68, 68, 0.3);
  }

  /* 行內展開編輯區塊 */
  .inline-edit-box {
    display: none;
    padding: 12px 14px;
    background: #FFFFFF;
    border-top: 1px dashed var(--border);
    flex-direction: column;
    gap: 8px;
  }
  .word-item.editing .inline-edit-box { display: flex; }
  .inline-actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .inline-actions .btn {
    height: 38px;
    font-size: 0.82rem;
    padding: 0 12px;
  }

  /* 清單選擇抽屜 */
  .deck-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .deck-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .deck-item.active {
    border-color: var(--primary);
    background: #EFF6FF;
  }
  .deck-info {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    min-width: 0;
  }
  .deck-count {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 500;
    flex-shrink: 0;
  }
  .deck-ops {
    display: none;
    gap: 6px;
    flex-shrink: 0;
  }
  .deck-management-mode .deck-ops { display: flex; }
</style>
</head>
<body>

<div id="app">
  <!-- 頂部列 -->
  <header class="topbar">
    <button class="icon-btn" id="btnOpenList" aria-label="單字列表">☰</button>
    <button class="deck-selector-btn" id="btnOpenDecks">
      <span class="deck-title-text" id="currentDeckTitle">請選擇清單</span>
      <span>▾</span>
    </button>
    <div style="width: 44px;"></div>
  </header>

  <!-- 卡片主區 -->
  <main class="stage">
    <div class="card" id="mainCard" style="display: none;">
      <div class="card-meta">
        <div class="card-meta-left">
          <span id="metaIndex">No. 000</span>
          <span id="metaTotal">/ 000</span>
        </div>
        <div class="card-meta-right">
          <button class="star-btn" id="btnCardStar" type="button" aria-label="收藏單字">☆</button>
          <button class="card-quick-edit-btn" id="btnCardQuickEdit" type="button">✎ 編輯</button>
        </div>
      </div>
      <div class="word-zone">
        <div class="word-text" id="displayWord">—</div>
      </div>
      <div class="trans-zone" id="transZone">
        <div class="trans-hint" id="transHint">點擊查看翻譯</div>
        <div class="trans-content blurred" id="transContent">
          <div class="trans-text" id="displayTrans">—</div>
          <div class="trans-note" id="displayNote"></div>
        </div>
      </div>
    </div>

    <div class="empty-state" id="emptyState">
      <p id="emptyPromptText">尚未建立任何單字清單<br>點擊下方按鈕開始新增！</p>
      <button class="btn btn-primary" id="btnCreateFirstDeck" style="margin-top: 14px;">＋ 建立第一份清單</button>
    </div>
  </main>

  <!-- 底部按鈕：上一個、中央新增、下一個 -->
  <footer class="bottom-nav">
    <button class="nav-btn" id="btnPrev" disabled>← 上一個</button>
    <button class="center-add-btn" id="btnCenterAdd" aria-label="新增單字">＋</button>
    <button class="nav-btn" id="btnNext" disabled>下一個 →</button>
  </footer>
</div>

<!-- 清單選擇與管理彈窗 -->
<div class="sheet-overlay" id="deckOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title">單字清單</div>
      <div class="sheet-header-actions">
        <button type="button" class="btn-text" id="btnNewDeck">＋ 新增</button>
        <button type="button" class="btn-text" id="btnToggleDeckManage">管理清單</button>
      </div>
    </div>
    <div class="sheet-body">
      <div class="deck-list" id="deckListContainer"></div>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn btn-secondary" id="btnCloseDecks">關閉</button>
    </div>
  </div>
</div>

<!-- 新增/編輯單字彈窗 -->
<div class="sheet-overlay" id="wordFormOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title" id="wordFormTitle">新增單字</div>
    </div>
    <div class="sheet-body">
      <label>原文單字 / 句子
        <input type="text" id="inputFormWord" placeholder="輸入單字，系統將自動翻譯…">
      </label>
      <div class="status-text" id="wordFormStatus"></div>
      <label>中文翻譯
        <input type="text" id="inputFormTrans" placeholder="自動翻譯結果（可手動修改）">
      </label>
      <label>補充筆記（選填）
        <input type="text" id="inputFormNote" placeholder="例句、詞性、記憶筆記…">
      </label>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn btn-secondary" id="btnCancelWordForm">取消</button>
      <button type="button" class="btn btn-primary" id="btnSaveWordForm">儲存單字</button>
    </div>
  </div>
</div>

<!-- 單字列表管理 -->
<div class="sheet-overlay" id="listOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title" id="listSheetTitle">本課單字</div>
      <button type="button" class="btn-text" id="btnToggleManage">管理 / 編輯</button>
    </div>
    <div class="sheet-body">
      <input type="search" id="searchInput" placeholder="搜尋當前清單單字…">
      <div class="sort-bar">
        <button type="button" class="chip chip-star" id="chipOnlyStar">⭐ 僅星號</button>
        <button type="button" class="chip" data-sort="time_desc">最新</button>
        <button type="button" class="chip" data-sort="time_asc">最舊</button>
        <button type="button" class="chip" data-sort="star_first">星號優先</button>
        <button type="button" class="chip" data-sort="alpha">A-Z</button>
        <button type="button" class="chip" data-sort="random">🎲 隨機</button>
      </div>
      <div class="word-list" id="wordListContainer"></div>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn btn-secondary" id="btnCloseList">關閉</button>
    </div>
  </div>
</div>

<script>
(function() {
  const STORAGE_DECKS = 'app_decks_v2';
  const STORAGE_WORDS = 'app_words_v2';
  const STORAGE_ACTIVE_DECK = 'app_active_deck_v2';
  const SORT_KEY = 'app_sort_v2';

  let decks = [];
  let words = [];
  let activeDeckId = null;
  let sortMode = localStorage.getItem(SORT_KEY) || 'time_desc';
  let onlyStarredFilter = false;
  let randomOrder = [];
  let currentWordId = null;
  let isRevealed = false;
  let isManageMode = false;
  let isDeckManageMode = false;
  let editingWordIdInList = null;
  let formEditingId = null;
  let debounceTimer = null;

  const $ = (id) => document.getElementById(id);

  function createId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function loadData() {
    try {
      decks = JSON.parse(localStorage.getItem(STORAGE_DECKS)) || [];
      words = JSON.parse(localStorage.getItem(STORAGE_WORDS)) || [];
      activeDeckId = localStorage.getItem(STORAGE_ACTIVE_DECK) || (decks[0] ? decks[0].id : null);
    } catch (e) {
      decks = [];
      words = [];
      activeDeckId = null;
    }
  }

  function saveData() {
    localStorage.setItem(STORAGE_DECKS, JSON.stringify(decks));
    localStorage.setItem(STORAGE_WORDS, JSON.stringify(words));
    if (activeDeckId) localStorage.setItem(STORAGE_ACTIVE_DECK, activeDeckId);
    else localStorage.removeItem(STORAGE_ACTIVE_DECK);
  }

  /* ---------- 清單過濾與排序 ---------- */
  function getActiveWords() {
    if (!activeDeckId) return [];
    return words.filter(w => w.deckId === activeDeckId);
  }

  function shuffleRandomOrder() {
    const list = getActiveWords();
    randomOrder = list.map(w => w.id);
    for (let i = randomOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [randomOrder[i], randomOrder[j]] = [randomOrder[j], randomOrder[i]];
    }
  }

  function getSortedActiveWords() {
    let list = getActiveWords().slice();
    if (onlyStarredFilter) {
      list = list.filter(w => w.starred);
    }
    if (sortMode === 'time_desc') {
      list.sort((a, b) => b.createdAt - a.createdAt);
    } else if (sortMode === 'time_asc') {
      list.sort((a, b) => a.createdAt - b.createdAt);
    } else if (sortMode === 'star_first') {
      list.sort((a, b) => (b.starred ? 1 : 0) - (a.starred ? 1 : 0) || b.createdAt - a.createdAt);
    } else if (sortMode === 'alpha') {
      list.sort((a, b) => a.word.localeCompare(b.word));
    } else if (sortMode === 'random') {
      const map = {};
      randomOrder.forEach((id, i) => map[id] = i);
      list.sort((a, b) => (map[a.id] ?? 0) - (map[b.id] ?? 0));
    }
    return list;
  }

  function setSort(mode) {
    if (mode === 'random') shuffleRandomOrder();
    sortMode = mode;
    localStorage.setItem(SORT_KEY, mode);
    updateSortChips();
    renderCard();
    renderList();
  }

  function toggleStarFilter() {
    onlyStarredFilter = !onlyStarredFilter;
    $('chipOnlyStar').classList.toggle('active', onlyStarredFilter);
    renderCard();
    renderList();
  }

  function updateSortChips() {
    document.querySelectorAll('.chip[data-sort]').forEach(chip => {
      chip.classList.toggle('active', chip.dataset.sort === sortMode);
    });
  }

  /* ---------- 主卡片渲染 ---------- */
  function renderCard() {
    const currentDeck = decks.find(d => d.id === activeDeckId);
    $('currentDeckTitle').textContent = currentDeck ? currentDeck.name : '尚未選取清單';

    const list = getSortedActiveWords();
    const total = list.length;
    const cardEl = $('mainCard');
    const emptyEl = $('emptyState');
    const promptText = $('emptyPromptText');
    const createBtn = $('btnCreateFirstDeck');
    const prevBtn = $('btnPrev');
    const nextBtn = $('btnNext');

    if (!currentDeck) {
      cardEl.style.display = 'none';
      emptyEl.style.display = 'block';
      promptText.innerHTML = '尚未建立任何單字清單<br>點擊下方按鈕開始新增！';
      createBtn.style.display = 'inline-block';
      prevBtn.disabled = true;
      nextBtn.disabled = true;
      currentWordId = null;
      return;
    }

    if (total === 0) {
      cardEl.style.display = 'none';
      emptyEl.style.display = 'block';
      if (onlyStarredFilter) {
        promptText.innerHTML = `「${currentDeck.name}」目前沒有收藏的星號單字！`;
      } else {
        promptText.innerHTML = `「${currentDeck.name}」目前沒有單字<br>點下方「＋」按鈕開始新增！`;
      }
      createBtn.style.display = 'none';
      prevBtn.disabled = true;
      nextBtn.disabled = true;
      currentWordId = null;
      return;
    }

    cardEl.style.display = 'flex';
    emptyEl.style.display = 'none';

    let idx = list.findIndex(w => w.id === currentWordId);
    if (idx === -1) {
      idx = 0;
      currentWordId = list[0].id;
    }

    const current = list[idx];
    $('metaIndex').textContent = 'No. ' + String(idx + 1).padStart(3, '0');
    $('metaTotal').textContent = '/ ' + String(total).padStart(3, '0');
    $('displayWord').textContent = current.word;
    $('displayTrans').textContent = current.trans || '(無翻譯)';
    $('displayNote').textContent = current.note || '';
    $('displayNote').style.display = current.note ? 'block' : 'none';

    const starBtn = $('btnCardStar');
    starBtn.textContent = current.starred ? '★' : '☆';
    starBtn.classList.toggle('starred', !!current.starred);

    isRevealed = false;
    applyReveal();

    prevBtn.disabled = total <= 1;
    nextBtn.disabled = total <= 1;
  }

  function applyReveal() {
    $('transContent').classList.toggle('blurred', !isRevealed);
    $('transHint').style.display = isRevealed ? 'none' : 'block';
  }

  function toggleReveal() {
    isRevealed = !isRevealed;
    applyReveal();
  }

  function toggleCurrentWordStar() {
    if (!currentWordId) return;
    const target = words.find(w => w.id === currentWordId);
    if (target) {
      target.starred = !target.starred;
      saveData();
      renderCard();
      renderList();
    }
  }

  function stepCard(delta) {
    const list = getSortedActiveWords();
    if (list.length === 0) return;
    let idx = list.findIndex(w => w.id === currentWordId);
    if (idx === -1) idx = 0;
    idx = (idx + delta + list.length) % list.length;
    currentWordId = list[idx].id;
    renderCard();
  }

  /* ---------- Google 官方翻譯端點 ---------- */
  async function autoTranslateWord(text, targetInputId, statusId) {
    const word = text.trim();
    if (!word) {
      $(statusId).textContent = '';
      return;
    }
    $(statusId).textContent = 'Google 翻譯中…';
    try {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-TW&dt=t&q=${encodeURIComponent(word)}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data && data[0] && data[0][0] && data[0][0][0]) {
        $(targetInputId).value = data[0][0][0];
        $(statusId).textContent = '已填入建議翻譯，可自由修改';
      } else {
        $(statusId).textContent = '無翻譯結果，請手動輸入';
      }
    } catch (e) {
      $(statusId).textContent = '連線失敗，請手動輸入';
    }
  }

  /* ---------- 清單管理 ---------- */
  function openDeckModal() {
    isDeckManageMode = false;
    updateDeckManageBtnText();
    $('deckOverlay').classList.add('active');
    renderDeckList();
  }
  function closeDeckModal() {
    $('deckOverlay').classList.remove('active');
  }

  function toggleDeckManageMode() {
    isDeckManageMode = !isDeckManageMode;
    updateDeckManageBtnText();
    renderDeckList();
  }

  function updateDeckManageBtnText() {
    $('btnToggleDeckManage').textContent = isDeckManageMode ? '完成' : '管理清單';
  }

  function renderDeckList() {
    const container = $('deckListContainer');
    container.innerHTML = '';
    container.className = isDeckManageMode ? 'deck-list deck-management-mode' : 'deck-list';

    if (decks.length === 0) {
      container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px;">尚無清單，請點右上角「＋ 新增」</div>';
      return;
    }

    decks.forEach(d => {
      const count = words.filter(w => w.deckId === d.id).length;
      const item = document.createElement('div');
      item.className = 'deck-item' + (d.id === activeDeckId ? ' active' : '');

      const info = document.createElement('div');
      info.className = 'deck-info';
      info.innerHTML = `<span>${d.name}</span><span class="deck-count">(${count})</span>`;

      const ops = document.createElement('div');
      ops.className = 'deck-ops';

      const renameBtn = document.createElement('button');
      renameBtn.className = 'btn-sm';
      renameBtn.textContent = '改名';
      renameBtn.type = 'button';
      renameBtn.onclick = (e) => {
        e.stopPropagation();
        const newName = prompt('請輸入新的清單名稱：', d.name);
        if (newName && newName.trim()) {
          d.name = newName.trim();
          saveData();
          renderDeckList();
          renderCard();
        }
      };

      const delBtn = document.createElement('button');
      delBtn.className = 'btn-sm del';
      delBtn.textContent = '刪除';
      delBtn.type = 'button';
      delBtn.onclick = (e) => {
        e.stopPropagation();
        if (confirm(`確定刪除「${d.name}」及其包含的全部單字嗎？`)) {
          decks = decks.filter(x => x.id !== d.id);
          words = words.filter(w => w.deckId !== d.id);
          if (activeDeckId === d.id) {
            activeDeckId = decks[0] ? decks[0].id : null;
          }
          saveData();
          renderDeckList();
          renderCard();
        }
      };

      ops.appendChild(renameBtn);
      ops.appendChild(delBtn);

      item.appendChild(info);
      item.appendChild(ops);

      item.onclick = () => {
        if (!isDeckManageMode) {
          activeDeckId = d.id;
          saveData();
          renderCard();
          closeDeckModal();
        }
      };

      container.appendChild(item);
    });
  }

  function handleCreateDeck() {
    const name = prompt('請輸入新清單名稱（例如：第一課、日常生活）：');
    if (name && name.trim()) {
      const newDeck = { id: createId(), name: name.trim() };
      decks.push(newDeck);
      activeDeckId = newDeck.id;
      saveData();
      renderCard();
      renderDeckList();
    }
  }

  /* ---------- 單字彈窗表單 ---------- */
  function openWordForm(targetId = null) {
    if (!activeDeckId) {
      handleCreateDeck();
      if (!activeDeckId) return;
    }
    formEditingId = targetId;
    const currentDeck = decks.find(d => d.id === activeDeckId);

    if (formEditingId) {
      const target = words.find(w => w.id === formEditingId);
      if (!target) return;
      $('wordFormTitle').textContent = `編輯單字`;
      $('inputFormWord').value = target.word;
      $('inputFormTrans').value = target.trans;
      $('inputFormNote').value = target.note;
      $('wordFormStatus').textContent = '';
    } else {
      $('wordFormTitle').textContent = `新增單字至「${currentDeck.name}」`;
      $('inputFormWord').value = '';
      $('inputFormTrans').value = '';
      $('inputFormNote').value = '';
      $('wordFormStatus').textContent = '';
    }

    $('wordFormOverlay').classList.add('active');
    setTimeout(() => {
      $('inputFormWord').focus();
    }, 150);
  }

  function closeWordForm() {
    $('wordFormOverlay').classList.remove('active');
    formEditingId = null;
  }

  function saveWordForm() {
    const word = $('inputFormWord').value.trim();
    const trans = $('inputFormTrans').value.trim();
    const note = $('inputFormNote').value.trim();

    if (!word) {
      $('wordFormStatus').textContent = '請輸入原文單字';
      return;
    }

    if (formEditingId) {
      const target = words.find(w => w.id === formEditingId);
      if (target) {
        target.word = word;
        target.trans = trans;
        target.note = note;
      }
    } else {
      const newWord = {
        id: createId(),
        deckId: activeDeckId,
        word,
        trans,
        note,
        starred: false,
        createdAt: Date.now()
      };
      words.push(newWord);
      if (sortMode === 'random') randomOrder.push(newWord.id);
      currentWordId = newWord.id;
    }

    saveData();
    closeWordForm();
    renderCard();
    renderList();
  }

  /* ---------- 單字清單 ---------- */
  function openListModal() {
    if (!activeDeckId) return;
    isManageMode = false;
    editingWordIdInList = null;
    updateManageBtnText();
    const currentDeck = decks.find(d => d.id === activeDeckId);
    $('listSheetTitle').textContent = `${currentDeck ? currentDeck.name : ''} 單字`;
    $('listOverlay').classList.add('active');
    $('searchInput').value = '';
    updateSortChips();
    renderList();
  }

  function closeListModal() {
    $('listOverlay').classList.remove('active');
    editingWordIdInList = null;
  }

  function toggleManageMode() {
    isManageMode = !isManageMode;
    editingWordIdInList = null;
    updateManageBtnText();
    renderList();
  }

  function updateManageBtnText() {
    $('btnToggleManage').textContent = isManageMode ? '完成' : '管理 / 編輯';
  }

  function renderList() {
    const query = $('searchInput').value.trim().toLowerCase();
    const list = getSortedActiveWords().filter(w => {
      if (!query) return true;
      return w.word.toLowerCase().includes(query) ||
             (w.trans && w.trans.toLowerCase().includes(query)) ||
             (w.note && w.note.toLowerCase().includes(query));
    });

    const container = $('wordListContainer');
    container.innerHTML = '';
    container.className = isManageMode ? 'word-list management-mode' : 'word-list';

    if (list.length === 0) {
      const empty = document.createElement('div');
      empty.style.textAlign = 'center';
      empty.style.color = 'var(--text-muted)';
      empty.style.fontSize = '0.85rem';
      empty.style.padding = '20px 0';
      empty.textContent = onlyStarredFilter ? '此清單沒有收藏的星號單字' : '此清單查無單字';
      container.appendChild(empty);
      return;
    }

    list.forEach(w => {
      const item = document.createElement('div');
      item.className = 'word-item' + (editingWordIdInList === w.id ? ' editing' : '');

      const main = document.createElement('div');
      main.className = 'word-item-main';

      const starBtn = document.createElement('button');
      starBtn.className = 'word-item-star' + (w.starred ? ' starred' : '');
      starBtn.textContent = w.starred ? '★' : '☆';
      starBtn.type = 'button';
      starBtn.onclick = (e) => {
        e.stopPropagation();
        w.starred = !w.starred;
        saveData();
        renderList();
        renderCard();
      };

      const info = document.createElement('div');
      info.className = 'word-item-info';
      info.innerHTML = `<div class="word-item-word">${w.word}</div><div class="word-item-trans">${w.trans || '(無翻譯)'}</div>`;

      const ops = document.createElement('div');
      ops.className = 'word-item-ops';

      const editBtn = document.createElement('button');
      editBtn.className = 'btn-sm';
      editBtn.textContent = editingWordIdInList === w.id ? '收合' : '編輯';
      editBtn.type = 'button';
      editBtn.onclick = (e) => {
        e.stopPropagation();
        editingWordIdInList = (editingWordIdInList === w.id) ? null : w.id;
        renderList();
      };

      const delBtn = document.createElement('button');
      delBtn.className = 'btn-sm del';
      delBtn.textContent = '刪除';
      delBtn.type = 'button';
      delBtn.onclick = (e) => {
        e.stopPropagation();
        if (confirm(`確定刪除「${w.word}」嗎？`)) {
          words = words.filter(x => x.id !== w.id);
          saveData();
          if (currentWordId === w.id) currentWordId = null;
          renderList();
          renderCard();
        }
      };

      ops.appendChild(editBtn);
      ops.appendChild(delBtn);

      main.appendChild(starBtn);
      main.appendChild(info);
      main.appendChild(ops);

      main.onclick = () => {
        if (!isManageMode) {
          currentWordId = w.id;
          renderCard();
          closeListModal();
        }
      };

      // 行內展開編輯
      const editBox = document.createElement('div');
      editBox.className = 'inline-edit-box';
      editBox.innerHTML = `
        <label>原文<input type="text" class="inline-input-word" value="${w.word}"></label>
        <div class="status-text inline-status"></div>
        <label>翻譯<input type="text" class="inline-input-trans" value="${w.trans}"></label>
        <label>筆記<input type="text" class="inline-input-note" value="${w.note || ''}"></label>
        <div class="inline-actions">
          <button type="button" class="btn btn-secondary inline-cancel-btn">取消</button>
          <button type="button" class="btn btn-primary inline-save-btn">儲存修改</button>
        </div>
      `;

      const inWord = editBox.querySelector('.inline-input-word');
      const inTrans = editBox.querySelector('.inline-input-trans');
      const inNote = editBox.querySelector('.inline-input-note');
      const inStatus = editBox.querySelector('.inline-status');

      editBox.querySelector('.inline-cancel-btn').onclick = () => {
        editingWordIdInList = null;
        renderList();
      };

      editBox.querySelector('.inline-save-btn').onclick = () => {
        const wordVal = inWord.value.trim();
        if (!wordVal) {
          inStatus.textContent = '原文不能為空';
          return;
        }
        w.word = wordVal;
        w.trans = inTrans.value.trim();
        w.note = inNote.value.trim();
        saveData();
        editingWordIdInList = null;
        renderList();
        renderCard();
      };

      item.appendChild(main);
      item.appendChild(editBox);
      container.appendChild(item);
    });
  }

  /* ---------- 手勢滑動支援 ---------- */
  function initSwipe() {
    const card = $('mainCard');
    let startX = 0, startY = 0, tracking = false;

    card.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      tracking = true;
    }, { passive: true });

    card.addEventListener('touchend', (e) => {
      if (!tracking) return;
      tracking = false;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;

      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        if (dx < 0) stepCard(1);
        else stepCard(-1);
      }
    }, { passive: true });
  }

  /* ---------- 事件監聽綁定 ---------- */
  function initEvents() {
    $('btnPrev').onclick = () => stepCard(-1);
    $('btnNext').onclick = () => stepCard(1);
    $('transZone').onclick = toggleReveal;

    // 主卡片星號與快速編輯
    $('btnCardStar').onclick = toggleCurrentWordStar;
    $('btnCardQuickEdit').onclick = (e) => {
      e.stopPropagation();
      if (currentWordId) openWordForm(currentWordId);
    };

    // 清單面板控制
    $('btnOpenDecks').onclick = openDeckModal;
    $('btnCloseDecks').onclick = closeDeckModal;
    $('btnNewDeck').onclick = handleCreateDeck;
    $('btnCreateFirstDeck').onclick = handleCreateDeck;
    $('btnToggleDeckManage').onclick = toggleDeckManageMode;
    $('deckOverlay').onclick = (e) => { if (e.target === $('deckOverlay')) closeDeckModal(); };

    // 底部中央新增單字按鈕
    $('btnCenterAdd').onclick = () => openWordForm(null);
    $('btnCancelWordForm').onclick = closeWordForm;
    $('btnSaveWordForm').onclick = saveWordForm;
    $('wordFormOverlay').onclick = (e) => { if (e.target === $('wordFormOverlay')) closeWordForm(); };
    $('inputFormWord').oninput = () => {
      if (formEditingId) return;
      clearTimeout(debounceTimer);
      $('wordFormStatus').textContent = '輸入中…';
      debounceTimer = setTimeout(() => {
        autoTranslateWord($('inputFormWord').value, 'inputFormTrans', 'wordFormStatus');
      }, 500);
    };

    // 單字清單
    $('btnOpenList').onclick = openListModal;
    $('btnCloseList').onclick = closeListModal;
    $('btnToggleManage').onclick = toggleManageMode;
    $('searchInput').oninput = renderList;
    $('chipOnlyStar').onclick = toggleStarFilter;
    $('listOverlay').onclick = (e) => { if (e.target === $('listOverlay')) closeListModal(); };

    // 排序標籤
    document.querySelectorAll('.chip[data-sort]').forEach(chip => {
      chip.onclick = () => setSort(chip.dataset.sort);
    });
  }

  // PWA Service Worker 註冊
  function registerServiceWorker() {
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('PWA ServiceWorker 註冊成功:', reg.scope))
          .catch((err) => console.log('PWA ServiceWorker 註冊失敗:', err));
      });
    }
  }

  // 啟動初始化
  loadData();
  if (sortMode === 'random') shuffleRandomOrder();
  initEvents();
  initSwipe();
  updateSortChips();
  renderCard();
  registerServiceWorker();
})();
</script>
</body>
</html>
