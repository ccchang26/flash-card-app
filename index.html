<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1E293B">
<title>Language Flashcard</title>
<style>
  :root {
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --text-main: #0F172A;
    --text-muted: #64748B;
    --primary: #2563EB;
    --primary-hover: #1D4ED8;
    --border: #E2E8F0;
    --danger: #EF4444;
    --card-bg: #FFFFFF;
    --mask-bg: #EEF2F6;
    --radius: 16px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    overscroll-behavior-y: none;
  }

  #app {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px);
  }

  /* ---------- 頂部列 ---------- */
  .topbar {
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar-title {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text-main);
  }
  .icon-btn {
    width: 44px;
    height: 44px;
    border: none;
    background: transparent;
    border-radius: 12px;
    color: var(--text-main);
    font-size: 1.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .icon-btn:active {
    background-color: var(--border);
  }

  /* ---------- 主舞台卡片 ---------- */
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 0;
  }
  .card {
    width: 100%;
    height: 100%;
    max-height: 520px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
    display: flex;
    flex-direction: column;
    padding: 20px;
    touch-action: pan-y;
    user-select: none;
  }
  .card-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .word-zone {
    flex: 1.2;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px 8px;
  }
  .word-text {
    font-size: clamp(2rem, 7vw, 2.8rem);
    font-weight: 700;
    color: var(--text-main);
    word-break: break-word;
    line-height: 1.25;
  }
  .trans-zone {
    flex: 1;
    background-color: var(--mask-bg);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    cursor: pointer;
  }
  .trans-content.blurred .trans-text,
  .trans-content.blurred .trans-note {
    filter: blur(8px);
    opacity: 0.25;
    user-select: none;
  }
  .trans-text {
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--text-main);
    word-break: break-word;
  }
  .trans-note {
    margin-top: 6px;
    font-size: 0.85rem;
    color: var(--text-muted);
    word-break: break-word;
  }
  .trans-hint {
    position: absolute;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--primary);
    background: rgba(255, 255, 255, 0.85);
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  /* ---------- 底部導覽 ---------- */
  .bottom-nav {
    height: 60px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .nav-btn {
    flex: 1;
    height: 52px;
    border: none;
    background-color: var(--text-main);
    color: #FFFFFF;
    font-size: 0.95rem;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
  }
  .nav-btn:active { opacity: 0.85; }
  .nav-btn[disabled] {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* ---------- 彈出面板 (Sheets) ---------- */
  .sheet-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
  }
  .sheet-overlay.active {
    display: flex;
  }
  .sheet {
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    max-height: 85dvh;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    display: flex;
    flex-direction: column;
    padding: 12px 20px env(safe-area-inset-bottom, 20px);
  }
  .sheet-handle {
    width: 36px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 12px;
  }
  .sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .sheet-title {
    font-size: 1.1rem;
    font-weight: 700;
  }
  .sheet-body {
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 12px;
  }

  /* 表單元件 */
  label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
  }
  input[type="text"],
  input[type="search"] {
    width: 100%;
    height: 46px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 1rem;
    color: var(--text-main);
    background-color: var(--bg);
  }
  input[type="text"]:focus,
  input[type="search"]:focus {
    outline: none;
    border-color: var(--primary);
  }
  .status-text {
    font-size: 0.78rem;
    color: var(--primary);
    min-height: 1.1rem;
  }

  .btn {
    height: 46px;
    padding: 0 16px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .btn-primary {
    background-color: var(--primary);
    color: #FFFFFF;
  }
  .btn-primary:active { background-color: var(--primary-hover); }
  .btn-secondary {
    background-color: transparent;
    border-color: var(--border);
    color: var(--text-main);
  }
  .btn-secondary:active { background-color: var(--border); }
  .btn-text {
    border: none;
    background: transparent;
    color: var(--primary);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .sheet-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .sheet-actions .btn {
    flex: 1;
  }

  /* 排序標籤 */
  .sort-bar {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 6px;
  }
  .chip {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 0.78rem;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
  }
  .chip.active {
    border-color: var(--primary);
    background: #EFF6FF;
    color: var(--primary);
  }

  /* 單字清單項目 */
  .word-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .word-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
  }
  .word-item-info {
    flex: 1;
    min-width: 0;
  }
  .word-item-word {
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--text-main);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .word-item-trans {
    font-size: 0.8rem;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 2px;
  }
  .word-item-ops {
    display: none;
    gap: 6px;
  }
  /* 管理模式下顯示按鈕 */
  .management-mode .word-item-ops {
    display: flex;
  }
  .btn-sm {
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 600;
    border: 1px solid var(--border);
    background: #FFFFFF;
    color: var(--text-main);
    cursor: pointer;
  }
  .btn-sm.del {
    color: var(--danger);
    border-color: rgba(239, 68, 68, 0.3);
  }
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="btnList" aria-label="單字列表">☰</button>
    <div class="topbar-title">Flashcard</div>
    <button class="icon-btn" id="btnAdd" aria-label="新增單字">＋</button>
  </header>

  <main class="stage">
    <div class="card" id="mainCard">
      <div class="card-meta">
        <span id="metaIndex">No. 000</span>
        <span id="metaTotal">/ 000</span>
      </div>
      <div class="word-zone">
        <div class="word-text" id="displayWord">—</div>
      </div>
      <div class="trans-zone" id="transZone">
        <div class="trans-hint" id="transHint">點擊查看翻譯</div>
        <div class="trans-content blurred" id="transContent">
          <div class="trans-text" id="displayTrans">—</div>
          <div class="trans-note" id="displayNote"></div>
        </div>
      </div>
    </div>
    <div class="empty-state" id="emptyState" style="display: none;">
      <p>目前單字庫是空的，點右上角「＋」開始新增！</p>
    </div>
  </main>

  <footer class="bottom-nav">
    <button class="nav-btn" id="btnPrev">← 上一個</button>
    <button class="nav-btn" id="btnNext">下一個 →</button>
  </footer>
</div>

<!-- 新增/編輯彈窗 -->
<div class="sheet-overlay" id="formOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title" id="formTitle">新增單字</div>
    </div>
    <div class="sheet-body">
      <label>原文單字 / 句子
        <input type="text" id="inputWord" placeholder="輸入單字，系統將自動翻譯…">
      </label>
      <div class="status-text" id="translateStatus"></div>
      <label>中文翻譯
        <input type="text" id="inputTrans" placeholder="自動翻譯結果（可手動修改）">
      </label>
      <label>補充筆記（選填）
        <input type="text" id="inputNote" placeholder="例句、詞性、用法筆記…">
      </label>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn btn-secondary" id="btnCancelForm">取消</button>
      <button type="button" class="btn btn-primary" id="btnSaveForm">儲存</button>
    </div>
  </div>
</div>

<!-- 單字列表彈窗 -->
<div class="sheet-overlay" id="listOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title">單字列表</div>
      <button type="button" class="btn-text" id="btnToggleManage">管理單字</button>
    </div>
    <div class="sheet-body">
      <input type="search" id="searchInput" placeholder="搜尋單字、翻譯或筆記…">
      <div class="sort-bar">
        <button type="button" class="chip" data-sort="time_desc">最新</button>
        <button type="button" class="chip" data-sort="time_asc">最舊</button>
        <button type="button" class="chip" data-sort="alpha">A-Z 字典序</button>
        <button type="button" class="chip" data-sort="random">🎲 隨機洗牌</button>
      </div>
      <div class="word-list" id="wordListContainer"></div>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn btn-secondary" id="btnCloseList">關閉</button>
    </div>
  </div>
</div>

<script>
(function() {
  const STORAGE_KEY = 'universal_flashcards_data_clean';
  const SORT_KEY = 'universal_flashcards_sort';

  let words = [];
  let sortMode = localStorage.getItem(SORT_KEY) || 'time_desc';
  let randomOrder = [];
  let currentWordId = null;
  let isRevealed = false;
  let editingId = null;
  let isManageMode = false;
  let debounceTimer = null;

  const $ = (id) => document.getElementById(id);

  function createId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      words = raw ? JSON.parse(raw) : [];
    } catch (e) {
      words = [];
    }
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
  }

  function shuffleRandomOrder() {
    randomOrder = words.map(w => w.id);
    for (let i = randomOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [randomOrder[i], randomOrder[j]] = [randomOrder[j], randomOrder[i]];
    }
  }

  function getSortedWords() {
    const list = words.slice();
    if (sortMode === 'time_desc') {
      list.sort((a, b) => b.createdAt - a.createdAt);
    } else if (sortMode === 'time_asc') {
      list.sort((a, b) => a.createdAt - b.createdAt);
    } else if (sortMode === 'alpha') {
      list.sort((a, b) => a.word.localeCompare(b.word));
    } else if (sortMode === 'random') {
      const map = {};
      randomOrder.forEach((id, i) => map[id] = i);
      list.sort((a, b) => (map[a.id] ?? 0) - (map[b.id] ?? 0));
    }
    return list;
  }

  function setSort(mode) {
    if (mode === 'random') shuffleRandomOrder();
    sortMode = mode;
    localStorage.setItem(SORT_KEY, mode);
    updateSortChips();
    renderCard();
    renderList();
  }

  function updateSortChips() {
    document.querySelectorAll('.chip[data-sort]').forEach(chip => {
      chip.classList.toggle('active', chip.dataset.sort === sortMode);
    });
  }

  function renderCard() {
    const list = getSortedWords();
    const total = list.length;
    const cardEl = $('mainCard');
    const emptyEl = $('emptyState');
    const prevBtn = $('btnPrev');
    const nextBtn = $('btnNext');

    if (total === 0) {
      cardEl.style.display = 'none';
      emptyEl.style.display = 'block';
      prevBtn.disabled = true;
      nextBtn.disabled = true;
      currentWordId = null;
      return;
    }

    cardEl.style.display = 'flex';
    emptyEl.style.display = 'none';

    let idx = list.findIndex(w => w.id === currentWordId);
    if (idx === -1) {
      idx = 0;
      currentWordId = list[0].id;
    }

    const current = list[idx];
    $('metaIndex').textContent = 'No. ' + String(idx + 1).padStart(3, '0');
    $('metaTotal').textContent = '/ ' + String(total).padStart(3, '0');
    $('displayWord').textContent = current.word;
    $('displayTrans').textContent = current.trans || '(無翻譯)';
    $('displayNote').textContent = current.note || '';
    $('displayNote').style.display = current.note ? 'block' : 'none';

    isRevealed = false;
    applyReveal();

    prevBtn.disabled = total <= 1;
    nextBtn.disabled = total <= 1;
  }

  function applyReveal() {
    $('transContent').classList.toggle('blurred', !isRevealed);
    $('transHint').style.display = isRevealed ? 'none' : 'block';
  }

  function toggleReveal() {
    isRevealed = !isRevealed;
    applyReveal();
  }

  function stepCard(delta) {
    const list = getSortedWords();
    if (list.length === 0) return;
    let idx = list.findIndex(w => w.id === currentWordId);
    if (idx === -1) idx = 0;
    idx = (idx + delta + list.length) % list.length;
    currentWordId = list[idx].id;
    renderCard();
  }

  /* ---------- 自動翻譯流程 (Debounced) ---------- */
  async function triggerAutoTranslate() {
    const word = $('inputWord').value.trim();
    if (!word) {
      $('translateStatus').textContent = '';
      return;
    }
    $('translateStatus').textContent = '自動翻譯中…';

    try {
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=Autodetect|zh-TW`);
      const data = await res.json();
      if (data && data.responseData && data.responseData.translatedText) {
        $('inputTrans').value = data.responseData.translatedText;
        $('translateStatus').textContent = '已自動填入翻譯，可點擊修改';
      } else {
        $('translateStatus').textContent = '未能取得翻譯，可手動輸入';
      }
    } catch (e) {
      $('translateStatus').textContent = '無法連線翻譯，可直接手動輸入';
    }
  }

  function onWordInput() {
    if (editingId) return; // 編輯舊單字時不自動覆寫翻譯
    clearTimeout(debounceTimer);
    $('translateStatus').textContent = '輸入中…';
    debounceTimer = setTimeout(triggerAutoTranslate, 500);
  }

  /* ---------- 表單流程 ---------- */
  function openForm(targetId = null) {
    editingId = targetId;
    $('translateStatus').textContent = '';
    
    if (editingId) {
      const target = words.find(w => w.id === editingId);
      if (!target) return;
      $('formTitle').textContent = '編輯單字';
      $('inputWord').value = target.word;
      $('inputTrans').value = target.trans;
      $('inputNote').value = target.note;
    } else {
      $('formTitle').textContent = '新增單字';
      $('inputWord').value = '';
      $('inputTrans').value = '';
      $('inputNote').value = '';
    }

    $('formOverlay').classList.add('active');
    setTimeout(() => $('inputWord').focus(), 100);
  }

  function closeForm() {
    $('formOverlay').classList.remove('active');
    editingId = null;
  }

  function saveForm() {
    const word = $('inputWord').value.trim();
    const trans = $('inputTrans').value.trim();
    const note = $('inputNote').value.trim();

    if (!word) {
      $('translateStatus').textContent = '請填寫原文單字';
      return;
    }

    if (editingId) {
      const target = words.find(w => w.id === editingId);
      if (target) {
        target.word = word;
        target.trans = trans;
        target.note = note;
      }
    } else {
      const newWord = {
        id: createId(),
        word,
        trans,
        note,
        createdAt: Date.now()
      };
      words.push(newWord);
      if (sortMode === 'random') randomOrder.push(newWord.id);
      currentWordId = newWord.id;
    }

    saveData();
    closeForm();
    renderCard();
    renderList();
  }

  /* ---------- 清單與管理模式 ---------- */
  function openList() {
    isManageMode = false;
    updateManageBtnText();
    $('listOverlay').classList.add('active');
    $('searchInput').value = '';
    updateSortChips();
    renderList();
  }

  function closeList() {
    $('listOverlay').classList.remove('active');
  }

  function toggleManageMode() {
    isManageMode = !isManageMode;
    updateManageBtnText();
    renderList();
  }

  function updateManageBtnText() {
    $('btnToggleManage').textContent = isManageMode ? '完成' : '管理 / 編輯';
  }

  function renderList() {
    const query = $('searchInput').value.trim().toLowerCase();
    const list = getSortedWords().filter(w => {
      if (!query) return true;
      return w.word.toLowerCase().includes(query) ||
             (w.trans && w.trans.toLowerCase().includes(query)) ||
             (w.note && w.note.toLowerCase().includes(query));
    });

    const container = $('wordListContainer');
    container.innerHTML = '';
    container.className = isManageMode ? 'word-list management-mode' : 'word-list';

    if (list.length === 0) {
      const empty = document.createElement('div');
      empty.style.textAlign = 'center';
      empty.style.color = 'var(--text-muted)';
      empty.style.fontSize = '0.85rem';
      empty.style.padding = '20px 0';
      empty.textContent = '查無符合單字';
      container.appendChild(empty);
      return;
    }

    list.forEach(w => {
      const item = document.createElement('div');
      item.className = 'word-item';
      
      const info = document.createElement('div');
      info.className = 'word-item-info';
      
      const wordDiv = document.createElement('div');
      wordDiv.className = 'word-item-word';
      wordDiv.textContent = w.word;
      
      const transDiv = document.createElement('div');
      transDiv.className = 'word-item-trans';
      transDiv.textContent = w.trans || '(無翻譯)';
      
      info.appendChild(wordDiv);
      info.appendChild(transDiv);

      const ops = document.createElement('div');
      ops.className = 'word-item-ops';

      const editBtn = document.createElement('button');
      editBtn.className = 'btn-sm';
      editBtn.textContent = '編輯';
      editBtn.type = 'button';
      editBtn.onclick = (e) => {
        e.stopPropagation();
        openForm(w.id);
      };

      const delBtn = document.createElement('button');
      delBtn.className = 'btn-sm del';
      delBtn.textContent = '刪除';
      delBtn.type = 'button';
      delBtn.onclick = (e) => {
        e.stopPropagation();
        if (confirm(`確定要刪除「${w.word}」嗎？`)) {
          words = words.filter(x => x.id !== w.id);
          saveData();
          if (currentWordId === w.id) currentWordId = null;
          renderList();
          renderCard();
        }
      };

      ops.appendChild(editBtn);
      ops.appendChild(delBtn);

      item.appendChild(info);
      item.appendChild(ops);

      // 非管理模式下點擊單字可直接跳轉複習
      item.onclick = () => {
        if (!isManageMode) {
          currentWordId = w.id;
          renderCard();
          closeList();
        }
      };

      container.appendChild(item);
    });
  }

  /* ---------- 觸控滑動 ---------- */
  function initSwipe() {
    const card = $('mainCard');
    let startX = 0, startY = 0, tracking = false;

    card.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      tracking = true;
    }, { passive: true });

    card.addEventListener('touchend', (e) => {
      if (!tracking) return;
      tracking = false;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;

      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        if (dx < 0) stepCard(1);
        else stepCard(-1);
      }
    }, { passive: true });
  }

  /* ---------- 事件監聽 ---------- */
  function initEvents() {
    $('btnPrev').onclick = () => stepCard(-1);
    $('btnNext').onclick = () => stepCard(1);
    $('transZone').onclick = toggleReveal;

    $('btnAdd').onclick = () => openForm();
    $('btnCancelForm').onclick = closeForm;
    $('btnSaveForm').onclick = saveForm;
    $('inputWord').oninput = onWordInput;
    $('formOverlay').onclick = (e) => {
      if (e.target === $('formOverlay')) closeForm();
    };

    $('btnList').onclick = openList;
    $('btnCloseList').onclick = closeList;
    $('btnToggleManage').onclick = toggleManageMode;
    $('searchInput').oninput = renderList;
    $('listOverlay').onclick = (e) => {
      if (e.target === $('listOverlay')) closeList();
    };

    document.querySelectorAll('.chip[data-sort]').forEach(chip => {
      chip.onclick = () => setSort(chip.dataset.sort);
    });
  }

  // 初始化
  loadData();
  if (sortMode === 'random') shuffleRandomOrder();
  initEvents();
  initSwipe();
  updateSortChips();
  renderCard();
})();
</script>
</body>
</html>
